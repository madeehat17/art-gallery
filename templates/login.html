<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(120deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: #111;
            padding: 35px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .login-container h2 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .login-container p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            outline: none;
        }

        .login-container input:focus {
            border-color: #00adb5;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background: #00adb5;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-container button:hover {
            background: #019ca4;
        }

        .login-container span {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
        }

        .login-container a {
            color: #00adb5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>Welcome Back</h2>
    <p>Please login to your account</p>

    <form method="POST" action="/register">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p style="color: #f00;">{{message}}</p>
  <span>Don't have an account? 
    <a href="{{url_for('register')}}">Sign up</a>
</span>

</div>


</body>
</html>
